spring.ai.mcp.server.name=lit-mcp
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.version=0.1.0

spring.main.banner-mode=off

# Force all logging to stderr
logging.config=classpath:logback-spring.xml

# Disable Spring Boot startup info logging
spring.main.log-startup-info=false

# Can be overridden with the corresponding environment variables.
lit-mcp.tool-timeout-millis=${LIT_MCP_TOOL_TIMEOUT_MILLIS:120000}
lit-mcp.http-request-timeout-millis=${LIT_MCP_HTTP_REQUEST_TIMEOUT_MILLIS:15000}
