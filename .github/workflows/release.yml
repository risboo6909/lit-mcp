name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          ./gradlew spotlessCheck test bootJar -PreleaseVersion="$RELEASE_VERSION"

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          mkdir release
          cp "build/libs/lit-mcp-$RELEASE_VERSION.jar" release/lit-mcp.jar
          cd release
          sha256sum lit-mcp.jar > lit-mcp.jar.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/lit-mcp.jar \
            release/lit-mcp.jar.sha256 \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
